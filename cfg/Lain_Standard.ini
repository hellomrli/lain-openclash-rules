;Lain 标准版规则
;基于 Aethersailor/Custom_OpenClash_Rules 思路精简：保留 OpenClash 常用直连/兜底逻辑，移除 YouTube/Netflix/Disney+/HBO/PrimeVideo 等媒体细分。
;规则仓库不包含任何订阅链接、节点名称或节点信息。

[custom]
; ===== 规则区：从上到下匹配 =====
; 本地地址直连
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve

; 核心服务优先，避免上游补充规则抢先匹配到错误策略组
ruleset=🇬 谷歌服务,[]GEOSITE,google
ruleset=🇬 谷歌服务,clash-classic:http://117.55.225.8:62552/rules/rule/Google_Classical.yaml,28800

; 自定义核心服务
ruleset=🤖 AI服务,clash-classic:http://117.55.225.8:62552/rules/rule/AI_Classical.yaml,28800
ruleset=🤖 AI服务,[]GEOSITE,category-ai-!cn
; 日本服务统一走这里（原独立 DMM 组已并入）
ruleset=🇯🇵 日本服务,clash-classic:http://117.55.225.8:62552/rules/rule/DMM_Classical.yaml,28800
ruleset=🇯🇵 日本服务,[]GEOSITE,dmm
ruleset=🇯🇵 日本服务,[]GEOSITE,abema
ruleset=🇯🇵 日本服务,[]GEOSITE,niconico
ruleset=🇯🇵 日本服务,[]GEOSITE,pixiv
ruleset=🇯🇵 日本服务,[]GEOSITE,dlsite
ruleset=🇯🇵 日本服务,[]GEOSITE,radiko
ruleset=🇯🇵 日本服务,[]GEOSITE,tver
ruleset=🇯🇵 日本服务,[]DOMAIN-SUFFIX,jp
; 乌龟服服务器 IP 必须放在非标端口规则之前，否则 8085 会被 Custom_Port_Direct 抢先直连
ruleset=🐢 乌龟服,[]IP-CIDR,178.249.208.186/32,no-resolve
ruleset=🐢 乌龟服,clash-classic:http://117.55.225.8:62552/rules/rule/TurtleWoW_Classical.yaml,28800
ruleset=🎮 Steam,[]GEOSITE,steam
ruleset=📺 Bahamut,[]GEOSITE,bahamut
ruleset=📺 Bilibili,clash-classic:http://117.55.225.8:62552/rules/rule/Bilibili_Classical.yaml,28800

; Aethersailor 上游直连/代理补充规则
ruleset=🎯 全球直连,clash-domain:https://api.asailor.org/Custom_OpenClash_Rules/main/rule/Custom_Direct_Domain.yaml,28800
ruleset=🎯 全球直连,clash-classic:https://api.asailor.org/Custom_OpenClash_Rules/main/rule/Custom_Direct_Classical_IP.yaml,28800
ruleset=🚀 手动选择,clash-domain:https://api.asailor.org/Custom_OpenClash_Rules/main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://api.asailor.org/Custom_OpenClash_Rules/main/rule/Custom_Proxy_Classical_IP.yaml,28800

; 常用服务保留
ruleset=🚀 GitHub,[]GEOSITE,github
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=🍎 苹果服务,[]GEOSITE,apple
ruleset=💬 即时通讯,[]GEOSITE,category-communication
ruleset=💬 即时通讯,[]GEOIP,telegram,no-resolve
ruleset=🚀 手动选择,[]GEOSITE,gfw

; 国内兜底直连
ruleset=🎯 全球直连,[]GEOSITE,google-cn
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
ruleset=🎯 全球直连,clash-classic:https://api.asailor.org/Custom_OpenClash_Rules/main/rule/Steam_CDN_Classical.yaml,28800
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve

; 非标端口直连优化与最终兜底
ruleset=🔀 非标端口,clash-classic:https://api.asailor.org/Custom_OpenClash_Rules/main/rule/Custom_Port_Direct.yaml,28800
ruleset=🐟 漏网之鱼,[]FINAL

; ===== 策略组区 =====
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50

custom_proxy_group=🤖 AI服务`select`[]🚀 手动选择`[]♻️ 自动选择`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇭🇰 香港节点`.*
custom_proxy_group=🇯🇵 日本服务`select`[]🇯🇵 日本节点`[]🚀 手动选择`[]♻️ 自动选择`.*
custom_proxy_group=🐢 乌龟服`select`[]🇭🇰 香港节点`[]🚀 手动选择`[]♻️ 自动选择`[]🇯🇵 日本节点`[]🇺🇸 美国节点`.*
custom_proxy_group=📺 Bilibili`select`[]🎯 全球直连`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇸 美国节点`[]🚀 手动选择`.*
custom_proxy_group=🎮 Steam`select`[]🎯 全球直连`[]🚀 手动选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`.*
custom_proxy_group=📺 Bahamut`select`[]🇯🇵 日本节点`[]🚀 手动选择`[]♻️ 自动选择`[]🎯 全球直连`.*

custom_proxy_group=🚀 GitHub`select`[]🚀 手动选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🎯 全球直连`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`.*
custom_proxy_group=🍎 苹果服务`select`[]🎯 全球直连`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`.*
custom_proxy_group=🇬 谷歌服务`select`[]🚀 手动选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`.*
custom_proxy_group=💬 即时通讯`select`[]🚀 手动选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🎯 全球直连`.*
custom_proxy_group=🔀 非标端口`select`[]🎯 全球直连`[]🚀 手动选择
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 手动选择`[]♻️ 自动选择`[]🎯 全球直连`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`.*

; 仅保留三个地区节点组：香港 / 美国 / 日本
custom_proxy_group=🇭🇰 香港节点`url-test`(🇭🇰|港|\bHK(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|hk|Hong Kong|HongKong|hongkong|HONG KONG|HONGKONG|深港|HKG|九龙|Kowloon|新界|沙田|荃湾|葵涌)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`(🇺🇸|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|纽纽|亚特兰大|迈阿密|华盛顿|\bUS(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|United States|UnitedStates|UNITED STATES|USA|America|AMERICA|JFK|EWR|IAD|ATL|ORD|MIA|NYC|LAX|SFO|SEA|DFW|SJC)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(🇯🇵|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(^|[^尼-])日|\bJP(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|Japan|JAPAN|JPN|NRT|HND|KIX|TYO|OSA|关西|Kansai|KANSAI)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🎯 全球直连`select`[]DIRECT

; 下方参数请勿修改
enable_rule_generator=true
overwrite_original_rules=true
udp=true
